apiVersion: v1
kind: ConfigMap
metadata:
  name: mindie-motor-user-config
  namespace: mindie-motor
data:
  user_config.json: |
    {
        "version": "v2.0",
        "motor_deploy_config": {
            "p_instances_num": 1,
            "d_instances_num": 1,
            "single_p_instance_pod_num": 1,
            "single_d_instance_pod_num": 1,
            "p_pod_npu_num": 8,
            "d_pod_npu_num": 8,
            "image_name": "swr.cn-south-1.myhuaweicloud.com/ascendhub/mindie-motor:3.3.0b1-vllm_ascend0.32.0rc1-a5-openeuler24.03-py3.12",
            "job_id": "mindie-motor",
            "hardware_type": "Ascend950",
            "dshm_size": "512Gi",
            "weight_mount_path": "/mnt/share/weight/",
            "coordinator_infer_node_port": 31015
        },
        "motor_controller_config": {},
        "motor_coordinator_config": {},
        "kv_cache_store_config": {
            "backend": "memcache",
            "local_service_mode": "inprocess",
            "local_config_path": "/usr/local/Ascend/pyMotor/conf/mmc-local-inprocess.conf"
        },
        "motor_engine_prefill_config": {
            "engine_type": "vllm",
            "engine_config": {
                "data_parallel_size": 8,
                "tensor_parallel_size": 1,
                "pipeline_parallel_size": 1,
                "data_parallel_rpc_port": 9000,
                "served_model_name": "dsv41",
                "model": "/mnt/share/weight/DeepSeek-V4.1-Flash",
                "enable_expert_parallel": true,
                "max-model-len": 1048576,
                "max-num-batched-tokens": 4096,
                "max-num-seqs": 16,
                "gpu_memory_utilization": 0.90,
                "block-size": 128,
                "quantization": "deepseek_v4_fp8",
                "enforce-eager": true,
                "no-enable-prefix-caching": true,
                "trust-remote-code": true,
                "tokenizer-mode": "deepseek_v41",
                "tool-call-parser": "deepseek_v41",
                "enable-auto-tool-choice": true,
                "reasoning-parser": "deepseek_v41",
                "engram-config": {
                    "cpu_offload": true,
                    "dp_shared_memory": true
                },
                "speculative-config": {
                    "method": "dspark",
                    "num_speculative_tokens": 5,
                    "enforce_eager": true
                },
                "additional-config": {
                    "enable_cpu_binding": true,
                    "multistream_engram_overlap": false,
                    "multistream_overlap_shared_expert": true,
                    "multistream_dsv4_dsa_overlap": true
                },
                "kv_transfer_config": {
                    "kv_connector": "MultiConnector",
                    "kv_role": "kv_producer",
                    "kv_load_failure_policy": "fail",
                    "engine_id": "0",
                    "kv_connector_extra_config": {
                        "connectors": [
                            {
                                "kv_connector": "MooncakeHybridConnector",
                                "kv_role": "kv_producer",
                                "kv_port": "26010",
                                "kv_connector_extra_config": {}
                            },
                            {
                                "kv_connector": "AscendStoreConnector",
                                "kv_role": "kv_producer",
                                "kv_connector_extra_config": {
                                    "backend": "memcache",
                                    "lookup_rpc_port": "0",
                                    "use_layerwise": false
                                }
                            }
                        ]
                    }
                }
            }
        },
        "motor_engine_decode_config": {
            "engine_type": "vllm",
            "engine_config": {
                "data_parallel_size": 8,
                "tensor_parallel_size": 1,
                "pipeline_parallel_size": 1,
                "data_parallel_rpc_port": 9000,
                "served_model_name": "dsv41",
                "model": "/mnt/share/weight/DeepSeek-V4.1-Flash",
                "enable_expert_parallel": true,
                "max-model-len": 1048576,
                "max-num-batched-tokens": 1024,
                "max-num-seqs": 64,
                "gpu_memory_utilization": 0.92,
                "block-size": 128,
                "quantization": "deepseek_v4_fp8",
                "enable-prefix-caching": true,
                "trust-remote-code": true,
                "tokenizer-mode": "deepseek_v41",
                "tool-call-parser": "deepseek_v41",
                "enable-auto-tool-choice": true,
                "reasoning-parser": "deepseek_v41",
                "engram-config": {
                    "cpu_offload": true,
                    "dp_shared_memory": true
                },
                "compilation-config": {
                    "cudagraph_mode": "FULL_DECODE_ONLY"
                },
                "speculative-config": {
                    "method": "dspark",
                    "num_speculative_tokens": 5,
                    "enforce_eager": false
                },
                "additional-config": {
                    "enable_cpu_binding": true,
                    "multistream_engram_overlap": true,
                    "multistream_overlap_shared_expert": true,
                    "multistream_dsv4_dsa_overlap": true,
                    "combine_quant_mode": 4,
                    "scheduler_config": {
                        "recompute_scheduler_enable": true
                    }
                },
                "kv_transfer_config": {
                    "kv_connector": "MultiConnector",
                    "kv_role": "kv_consumer",
                    "kv_load_failure_policy": "fail",
                    "engine_id": "1",
                    "kv_connector_extra_config": {
                        "connectors": [
                            {
                                "kv_connector": "MooncakeHybridConnector",
                                "kv_role": "kv_consumer",
                                "kv_port": "27010",
                                "kv_connector_extra_config": {}
                            },
                            {
                                "kv_connector": "AscendStoreConnector",
                                "kv_role": "kv_consumer",
                                "kv_connector_extra_config": {
                                    "backend": "memcache",
                                    "lookup_rpc_port": "0",
                                    "use_layerwise": false
                                }
                            }
                        ]
                    }
                }
            }
        }
    }
  env.json: |
    {
      "version": "2.0.0",
      "motor_common_env": {
        "CANN_INSTALL_PATH": "/usr/local/Ascend",
        "MOTOR_LOG_ROOT_PATH": "/root/ascend/log",
        "MOTOR_ENABLE_IPC_HOST": 1
      },
      "motor_controller_env": {},
      "motor_coordinator_env": {},
      "motor_engine_prefill_env": {
        "VLLM_USE_V2_MODEL_RUNNER": 1,
        "HCCL_OP_EXPANSION_MODE": "CCU_SCHED",
        "HCCL_BUFFSIZE": 1024,
        "HCCL_CONNECT_TIMEOUT": 1200,
        "HCCL_EXEC_TIMEOUT": 2040,
        "VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS": 3000,
        "OMP_PROC_BIND": "false",
        "OMP_NUM_THREADS": 10,
        "PYTORCH_NPU_ALLOC_CONF": "expandable_segments:True",
        "ASCEND_LOCAL_COMM_RES": "{\"version\":\"1.3\"}"
      },
      "motor_engine_decode_env": {
        "VLLM_USE_V2_MODEL_RUNNER": 1,
        "HCCL_OP_EXPANSION_MODE": "CCU_SCHED",
        "HCCL_BUFFSIZE": 1600,
        "HCCL_CONNECT_TIMEOUT": 1200,
        "HCCL_EXEC_TIMEOUT": 2040,
        "VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS": 3000,
        "OMP_PROC_BIND": "false",
        "OMP_NUM_THREADS": 10,
        "PYTORCH_NPU_ALLOC_CONF": "expandable_segments:True",
        "ASCEND_LOCAL_COMM_RES": "{\"version\":\"1.3\"}"
      },
      "motor_kv_cache_store_env": {}
    }
